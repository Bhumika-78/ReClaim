<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReClaim | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: #F9F5F2;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <!-- Card -->
    <div class="bg-white shadow-xl rounded-2xl p-8 w-[380px]">

        <!-- Logo -->
        <div class="flex flex-col items-center mb-6">
            <div class="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-user text-white text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold mt-3 text-gray-800">Welcome Back</h2>
            <p class="text-gray-500 text-sm">Login to continue</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="space-y-5">

            <div>
                <label class="text-sm font-medium text-gray-600">Email</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="email" id="loginEmail"
                        class="w-full pl-10 pr-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                        placeholder="Enter your email" required>
                </div>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-600">Password</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="loginPassword"
                        class="w-full pl-10 pr-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                        placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition">
                Login
            </button>

            <p class="text-center text-sm text-gray-600">
                Don't have an account?
                <a href="signup.html" class="text-red-600 font-semibold hover:underline">Sign Up</a>
            </p>
        </form>
    </div>

    <!-- JS -->
    <script>
        async function fakeLoginAPI(email, password) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (email && password) resolve({ success: true, message: "Login successful!" });
                    else reject({ success: false, message: "Missing credentials!" });
                }, 900);
            });
        }

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const email = loginEmail.value;
            const pass = loginPassword.value;

            try {
                const r = await fakeLoginAPI(email, pass);
                alert(r.message);
            } catch (err) {
                alert(err.message);
            }
        });
    </script>

</body>

</html>
