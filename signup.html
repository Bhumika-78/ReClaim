<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReClaim | Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: #F9F5F2;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

    <!-- Card -->
    <div class="bg-white shadow-xl rounded-2xl p-8 w-[400px]">

        <!-- Logo -->
        <div class="flex flex-col items-center mb-6">
            <div class="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-user-plus text-white text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold mt-3 text-gray-800">Create Account</h2>
            <p class="text-gray-500 text-sm">Join ReClaim today</p>
        </div>

        <!-- Form -->
        <form id="signupForm" class="space-y-5">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium text-gray-600">First Name</label>
                    <input type="text" id="firstName"
                        class="w-full mt-1 px-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                        placeholder="First name" required>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-600">Last Name</label>
                    <input type="text" id="lastName"
                        class="w-full mt-1 px-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                        placeholder="Last name" required>
                </div>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-600">Email</label>
                <input type="email" id="signupEmail"
                    class="w-full mt-1 px-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                    placeholder="Enter your email" required>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-600">Phone</label>
                <input type="tel" id="phone"
                    class="w-full mt-1 px-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                    placeholder="Phone number" required>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-600">Password</label>
                <input type="password" id="signupPassword"
                    class="w-full mt-1 px-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                    placeholder="Create password" required>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-600">Confirm Password</label>
                <input type="password" id="confirmPassword"
                    class="w-full mt-1 px-4 py-3 border rounded-lg focus:border-red-600 outline-none"
                    placeholder="Confirm password" required>
            </div>

            <button type="submit"
                class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition">
                Create Account
            </button>

            <p class="text-center text-sm text-gray-600">
                Already have an account?
                <a href="login.html" class="text-red-600 font-semibold hover:underline">Login</a>
            </p>
        </form>
    </div>

    <!-- JS -->
    <script>
        async function fakeSignupAPI(fn, ln, email, ph, pass, cpass) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (pass !== cpass) reject({ success: false, message: "Passwords do not match!" });
                    else resolve({ success: true, message: "Signup successful!" });
                }, 900);
            });
        }

        document.getElementById("signupForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            try {
                const r = await fakeSignupAPI(
                    firstName.value,
                    lastName.value,
                    signupEmail.value,
                    phone.value,
                    signupPassword.value,
                    confirmPassword.value
                );
                alert(r.message);
            } catch (err) {
                alert(err.message);
            }
        });
    </script>

</body>
</html>
